<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Lernkarten</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22Lernkarten%22,%22short_name%22:%22Lernkarten%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234F46E5' width='192' height='192'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>📚</text></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}],%22start_url%22:%22.%22,%22display%22:%22fullscreen%22,%22orientation%22:%22portrait%22,%22theme_color%22:%22%234F46E5%22,%22background_color%22:%22%23F1F5F9%22}">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #4F46E5;
  --primary-dk: #3730A3;
  --bg: #F1F5F9;
  --surface: #FFFFFF;
  --text: #0F172A;
  --muted: #64748B;
  --border: #E2E8F0;
  --r: 14px;
}

html, body { height: 100%; width: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding-top: max(0px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
}

.app {
  width: 100%;
  max-width: 500px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 0 18px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header-right {
  margin-left: auto;
  display: flex;
  gap: 8px;
}
.logout-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  padding: 6px 10px;
  border-radius: 6px;
}
.logout-btn:hover { background: #EEF2FF; color: var(--primary); }
.back-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 22px;
  color: var(--primary);
  line-height: 1;
  padding: 4px 6px;
  border-radius: 8px;
}
.back-btn:hover { background: #EEF2FF; }

/* SCREENS */
.screen { display: none; flex-direction: column; flex: 1; }
.screen.active { display: flex; }

/* LOGIN */
.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 20px;
}
.login-icon { font-size: 60px; }
.login-title { font-size: 24px; font-weight: 700; text-align: center; }
.login-text { text-align: center; color: var(--muted); margin-bottom: 10px; }
.google-btn {
  padding: 14px 20px;
  border-radius: var(--r);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid #4285F4;
  background: white;
  color: #4285F4;
  width: 100%;
  max-width: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.google-btn:hover { background: #F8F9FA; }

/* STATS */
.stats-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.stat {
  background: var(--surface);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  border-bottom: 3px solid var(--border);
}
.stat-num { font-size: 22px; font-weight: 800; display: block; }
.stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; display: block; }
.s0 { border-color: #EF4444; } .s0 .stat-num { color: #EF4444; }
.s1 { border-color: #F97316; } .s1 .stat-num { color: #F97316; }
.s2 { border-color: #EAB308; } .s2 .stat-num { color: #EAB308; }
.s3 { border-color: #84CC16; } .s3 .stat-num { color: #84CC16; }
.s4 { border-color: #22C55E; } .s4 .stat-num { color: #22C55E; }

/* BUTTONS */
.btn {
  padding: 16px 20px;
  border-radius: var(--r);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  width: 100%;
  transition: all 0.15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dk); }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.menu-btns { display: flex; flex-direction: column; gap: 10px; }

.io-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.btn-sm {
  padding: 12px 16px;
  border-radius: var(--r);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: all 0.15s;
  width: 100%;
}
.btn-sm:hover { border-color: var(--primary); color: var(--primary); }

/* FILE STATUS */
.file-status {
  background: var(--surface);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 13px;
  line-height: 1.45;
  border-left: 4px solid var(--border);
}
.file-status.ok { border-left-color: #22C55E; }
.file-status.warn { border-left-color: #F59E0B; }
.fs-name { font-weight: 700; color: var(--text); overflow-wrap: anywhere; }
.fs-info { color: var(--muted); }

/* MODAL */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 22px 20px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.modal h2 { font-size: 18px; margin-bottom: 8px; }
.modal p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
.modal-btns { display: flex; flex-direction: column; gap: 8px; }
.modal-btns .btn { padding: 12px 16px; font-size: 15px; }
.btn-danger { background: #FEE2E2; color: #991B1B; }
.btn-danger:hover { background: #FECACA; }

/* ADD FORM */
.form-group { margin-bottom: 14px; }
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--muted);
  margin-bottom: 6px;
}
textarea {
  width: 100%;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: var(--r);
  font-size: 16px;
  font-family: inherit;
  resize: vertical;
  min-height: 90px;
  background: var(--surface);
  color: var(--text);
  transition: border-color 0.15s;
}
textarea:focus { outline: none; border-color: var(--primary); }

/* CARDS LIST */
.cards-total {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  padding: 8px 0 14px;
}
.cards-list { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.card-item {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 8px;
  border-left: 4px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.ci0 { border-color: #EF4444; }
.ci1 { border-color: #F97316; }
.ci2 { border-color: #EAB308; }
.ci3 { border-color: #84CC16; }
.ci4 { border-color: #22C55E; }
.card-item-body { flex: 1; }
.ci-q { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
.ci-a { font-size: 13px; color: var(--muted); }
.del-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 15px;
  padding: 2px 6px;
  border-radius: 6px;
  flex-shrink: 0;
}
.del-btn:hover { color: #EF4444; background: #FEE2E2; }

/* QUIZ */
.quiz-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.prog-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.35s ease;
}
.prog-txt { font-size: 13px; color: var(--muted); white-space: nowrap; }

.flashcard {
  background: var(--surface);
  border-radius: 18px;
  padding: 28px 24px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.09);
  cursor: pointer;
  position: relative;
  margin-bottom: 20px;
  user-select: none;
}
.flashcard:hover { box-shadow: 0 6px 30px rgba(0,0,0,0.13); }

.fc-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 10px;
}
.fc-text { font-size: 20px; line-height: 1.5; font-weight: 500; }
.fc-divider { height: 1px; background: var(--border); margin: 18px 0; }
.fc-tap-hint {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-top: 18px;
}

.drill-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  background: #FEE2E2;
  color: #B91C1C;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
}

.quiz-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.quiz-actions button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  border: none;
  cursor: pointer;
  background: var(--surface);
  color: var(--muted);
  border: 2px solid var(--border);
  font-weight: 600;
}
.quiz-actions button:hover { border-color: var(--primary); color: var(--primary); }

/* 2-BUTTON RATING */
.rating-wrap { display: none; }
.rating-lbl { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.rating-btns-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rbtn2 {
  padding: 18px 12px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.12s;
}
.rbtn2:hover { transform: translateY(-2px); filter: brightness(0.93); }
.rbtn2:active { transform: scale(0.97); }
.r-no  { background: #FEE2E2; color: #991B1B; }
.r-yes { background: #DCFCE7; color: #15803D; }

.kbd {
  display: inline-block;
  background: rgba(0,0,0,0.1);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px;
  font-family: monospace;
  margin-left: 6px;
  vertical-align: middle;
}

/* SUMMARY */
.summary {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 0;
}
.sum-emoji { font-size: 64px; margin-bottom: 16px; }
.sum-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
.sum-text { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
.sum-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* EMPTY */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  padding: 40px 20px;
  gap: 10px;
}
.empty-icon { font-size: 52px; }

/* CARD EDITING */
.card-item-btns {
  display: flex;
  gap: 6px;
}
.edit-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.2s;
}
.edit-btn:hover { background: #EEF2FF; }

.card-edit-field {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 2px solid var(--primary);
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  resize: vertical;
  min-height: 60px;
}

.card-edit-field:focus {
  outline: none;
  border-color: var(--primary-dk);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.save-btn {
  background: #22C55E;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  flex: 1;
  transition: all 0.2s;
}

.save-btn:hover { background: #16A34A; }

.cancel-btn {
  background: #EF4444;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  flex: 1;
  transition: all 0.2s;
}

.cancel-btn:hover { background: #DC2626; }
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN SCREEN -->
  <div id="s-login" class="screen active">
    <div class="login-screen">
      <div class="login-icon">📚</div>
      <div class="login-title">Lernkarten</div>
      <div class="login-text">Melde dich mit Google an um zu beginnen</div>
      <button class="google-btn" onclick="loginGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#4285F4"/>
          <text x="12" y="15" font-size="14" fill="white" text-anchor="middle" font-weight="bold">G</text>
        </svg>
        Mit Google anmelden
      </button>
    </div>
  </div>

  <!-- HOME -->
  <div id="s-home" class="screen">
    <div class="header">
      <h1>Lernkarten</h1>
      <div class="header-right">
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
    <div id="file-status" class="file-status"></div>
    <div id="stats-row" class="stats-row"></div>
    <div class="menu-btns">
      <button class="btn btn-primary" onclick="startQuiz()">Abfragen starten</button>
      <button class="btn btn-secondary" onclick="showScreen('s-add')">Karte hinzufügen</button>
      <button class="btn btn-secondary" onclick="openCardsList()">Editieren</button>
      <div class="io-row">
        <button class="btn-sm" id="save-now-btn" onclick="saveNow()">Speichern</button>
        <button class="btn-sm" onclick="triggerMerge()">Karten ergänzen</button>
        <button class="btn-sm" onclick="triggerImport()">Kartei wechseln</button>
        <button class="btn-sm" onclick="newKartei()">Neue Kartei</button>
      </div>
      <input type="file" id="csv-in" accept=".csv" style="display:none" onchange="switchKartei(this)">
      <input type="file" id="csv-add" accept=".csv" style="display:none" onchange="importCSV(this)">
    </div>
  </div>

  <!-- ADD -->
  <div id="s-add" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('s-home')">←</button>
      <h1>Neue Karte</h1>
    </div>
    <div class="form-group">
      <label>Frage</label>
      <textarea id="inp-q" placeholder="Was soll abgefragt werden?" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Antwort</label>
      <textarea id="inp-a" placeholder="Die Antwort darauf …" rows="4"></textarea>
    </div>
    <button class="btn btn-primary" id="save-btn" onclick="addCard()">Speichern</button>
  </div>

  <!-- CARDS LIST -->
  <div id="s-cards" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('s-home')">←</button>
      <h1>Alle Karten</h1>
    </div>
    <div id="cards-total" class="cards-total"></div>
    <div id="cards-list" class="cards-list"></div>
  </div>

  <!-- QUIZ -->
  <div id="s-quiz" class="screen">
    <div class="header">
      <button class="back-btn" onclick="endQuiz()">←</button>
      <h1 id="quiz-title">Abfrage</h1>
    </div>
    <div id="quiz-body"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot, query, where } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB-oTAfcV4h2mNvj2Wfzike84JUxncaR2g",
  authDomain: "lernkarten-17750.firebaseapp.com",
  projectId: "lernkarten-17750",
  storageBucket: "lernkarten-17750.firebasestorage.app",
  messagingSenderId: "568529536947",
  appId: "1:568529536947:web:a38ce63a2f21ff49c4adc6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let cards = [];
let Q = null;
let currentFileHandle = null; // FileSystemAccessAPI handle
const LVL_LABELS = ['Gar nicht', 'Schlecht', 'Mittel', 'Gut', 'Sehr gut'];
const WEIGHTS = [10, 6, 3, 1.5, 0.5];

// ── Auth ──────────────────────────────────────────────────────
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    loadCards();
    showScreen('s-home');
  } else {
    showScreen('s-login');
  }
});

function loginGoogle() {
  signInWithPopup(auth, provider).catch(err => alert('Login fehlgeschlagen: ' + err.message));
}

function logout() {
  if (confirm('Wirklich abmelden?')) {
    signOut(auth).then(() => {
      cards = [];
      removeAllListeners();
      showScreen('s-login');
    });
  }
}

// ── Listeners ─────────────────────────────────────────────────
let unsubscribe = null;
function removeAllListeners() {
  if (unsubscribe) unsubscribe();
}

function loadCards() {
  if (!currentUser) return;
  const q = query(collection(db, 'cards'), where('userId', '==', currentUser.uid));
  unsubscribe = onSnapshot(q, (snap) => {
    cards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStats();
  }, (err) => console.error('Load error:', err));
}

// ── Navigation ────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 's-home') renderStats();
}

// ── Stats ─────────────────────────────────────────────────────
function renderStats() {
  const cnt = [0,0,0,0,0];
  cards.forEach(c => cnt[c.level || 0]++);
  document.getElementById('stats-row').innerHTML = cnt.map((n,i) =>
    `<div class="stat s${i}"><span class="stat-num">${n}</span><span class="stat-lbl">${LVL_LABELS[i]}</span></div>`
  ).join('');
  renderStatus();
}

// ── Datei-Status ──────────────────────────────────────────────
function deckName() {
  if (currentFileHandle) return currentFileHandle.name;
  const p = localStorage.getItem('lastFilePath') || '';
  return p.split('/').pop() || '';
}

function markSaved() {
  try { localStorage.setItem('lastSavedAt', new Date().toISOString()); } catch (e) {}
  renderStatus();
}

function renderStatus() {
  const el = document.getElementById('file-status');
  if (!el) return;
  const name = deckName() || 'Kartei ohne Dateinamen';
  const n = `${cards.length} Karte${cards.length !== 1 ? 'n' : ''}`;
  let info, cls;
  if (currentFileHandle) {
    cls = 'ok';
    info = 'Mit der Datei verbunden – jede Änderung wird automatisch dort gesichert.';
  } else {
    cls = 'warn';
    const t = localStorage.getItem('lastSavedAt');
    const when = t ? new Date(t).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : null;
    info = 'Nicht mit der Datei verbunden – der Lernstand liegt nur in der Cloud. ' +
      (when ? `Zuletzt in Datei gesichert: ${when}.` : 'Auf diesem Gerät noch nicht in einer Datei gesichert.') +
      ' Zum Sichern »Speichern« tippen.';
  }
  el.className = 'file-status ' + cls;
  el.innerHTML = `<div class="fs-name">📄 ${escTxt(name)} · ${n}</div><div class="fs-info">${info}</div>`;
}

// ── Dialog mit mehreren Knöpfen ───────────────────────────────
// buttons: [{ id, label, style: 'primary' | 'secondary' | 'danger' }]
function choose(title, text, buttons) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h2>${escTxt(title)}</h2>
        <p>${escTxt(text)}</p>
        <div class="modal-btns">
          ${buttons.map(b => `<button class="btn btn-${b.style || 'secondary'}" data-id="${b.id}">${escTxt(b.label)}</button>`).join('')}
        </div>
      </div>`;
    const close = (id) => {
      document.removeEventListener('keydown', onEsc);
      back.remove();
      resolve(id);
    };
    const onEsc = (e) => { if (e.key === 'Escape') close('cancel'); };
    back.addEventListener('click', (e) => {
      const id = e.target.getAttribute && e.target.getAttribute('data-id');
      if (id) close(id);
      else if (e.target === back) close('cancel');
    });
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(back);
  });
}

// ── Kartei Switching ──────────────────────────────────────────
async function triggerImport() {
  if (cards.length > 0) {
    // Verbundene Datei: aktuellen Stand still sichern, dann wechseln
    let saved = false;
    if (currentFileHandle) saved = await saveToCurrentHandle();

    if (!saved) {
      const choice = await choose(
        'Kartei wechseln',
        `Die geladene Kartei (${cards.length} Karte${cards.length !== 1 ? 'n' : ''}) wird durch die gewählte Datei ersetzt. ` +
        'Der aktuelle Lernstand ist in keiner Datei gesichert. Wenn du ihn behalten willst, sichere ihn vorher. ' +
        'Um nur neue Karten hinzuzufügen, nimm stattdessen »Karten ergänzen«.',
        [
          { id: 'save', label: 'Erst sichern, dann wechseln', style: 'primary' },
          { id: 'discard', label: 'Ohne Sichern ersetzen', style: 'danger' },
          { id: 'cancel', label: 'Abbrechen', style: 'secondary' }
        ]
      );
      if (choice === 'cancel') return;
      if (choice === 'save') {
        const ok = await saveWithDialog();
        if (!ok) return;
        // Neuer Klick nötig, damit der Browser den Öffnen-Dialog erlaubt
        const go = await choose('Gesichert ✓', 'Jetzt die Datei wählen, die geladen werden soll.', [
          { id: 'open', label: 'Datei wählen', style: 'primary' },
          { id: 'cancel', label: 'Abbrechen', style: 'secondary' }
        ]);
        if (go !== 'open') return;
      }
    }
  }

  // Open new file
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'CSV Files', accept: { 'text/csv': ['.csv'] } }]
      });
      const file = await handle.getFile();
      const text = await file.text();
      const oldHandle = currentFileHandle;
      currentFileHandle = null; // clear old handle before import
      const ok = await processImportCSV(text.replace(/^﻿/, ''), handle.name);
      if (ok === true) {
        currentFileHandle = handle; // set new handle only after import complete
        markSaved();
      } else if (ok === false) {
        currentFileHandle = oldHandle; // Datei war ungültig, nichts wurde verändert
        renderStatus();
      }
      return;
    } catch (err) {
      if (err.name !== 'AbortError') console.error('Open error:', err);
      return;
    }
  }

  // Fallback: traditional file picker
  document.getElementById('csv-in').click();
}

// Karten aus CSV-Zeilen lesen: Kommentarzeilen (#…) und Kopfzeile (Frage,Antwort,Level) überspringen
function extractCards(rows) {
  const out = [];
  for (const r of rows) {
    const q = (r[0] || '').trim();
    const a = (r[1] || '').trim();
    if (q.startsWith('#')) continue;
    if (q.toLowerCase() === 'frage' && a.toLowerCase() === 'antwort') continue;
    if (!q || !a) continue;
    out.push({ q, a, level: Math.min(4, Math.max(0, parseInt(r[2]) || 0)) });
  }
  return out;
}

function normQ(s) {
  return s.toLowerCase().replace(/\s+/g, ' ').trim();
}

// Rückgabe: true = gewechselt, false = Datei ungültig (nichts verändert), null = Fehler nach Beginn des Wechsels
async function processImportCSV(text, filename) {
  const newCards = extractCards(parseCSV(text));
  if (!newCards.length) { alert('In dieser Datei wurden keine Karten gefunden.'); return false; }

  // Pause listener so UI doesn't flicker during delete
  removeAllListeners();
  try {
    await Promise.all(cards.map(card => deleteDoc(doc(db, 'cards', card.id))));
  } catch (err) {
    console.error('Delete error:', err);
    alert('Fehler beim Löschen der Karten: ' + err.message);
    loadCards();
    return null;
  }

  // Den echten Dateinamen merken (für Statuszeile und Speichern)
  localStorage.setItem('lastFilePath', filename || `lernkarten-${new Date().toISOString().split('T')[0]}.csv`);

  // Import all in parallel (Promise.all) - much faster!
  let added = 0;
  try {
    await Promise.all(newCards.map(c => addDoc(collection(db, 'cards'), {
      userId: currentUser.uid,
      question: c.q,
      answer: c.a,
      level: c.level,
      createdAt: new Date()
    })));
    added = newCards.length;
  } catch (err) {
    console.error('Import error:', err);
  }

  // Resubscribe listener so new cards appear in UI
  loadCards();
  alert(`Kartei gewechselt! ${added} Karten geladen.`);
  return added > 0 ? true : null;
}

async function switchKartei(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    const text = e.target.result.replace(/^﻿/, '');

    if (ok === true) markSaved();
    input.value = '';
  };

// ── CSV Helper ────────────────────────────────────────────────
function generateCSV(includePath = true) {
  const today = new Date().toISOString().split('T')[0];
  const lastPath = localStorage.getItem('lastFilePath') || `lernkarten-${today}.csv`;

  const rows = includePath ? [[`# Dateipfad: ${lastPath}`], ['Frage', 'Antwort', 'Level']] : [['Frage', 'Antwort', 'Level']];
  cards.forEach(c => rows.push([c.question, c.answer, c.level || 0]));
  return rows.map(r =>
    r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');
}

// Save current cards silently to the already-open file handle
async function saveToCurrentHandle() {
  if (!currentFileHandle) return false;
  try {
    const writable = await currentFileHandle.createWritable();
    await writable.write('﻿' + generateCSV(true));
    await writable.close();
    markSaved();
    return true;
  } catch (err) {
    console.error('Save error:', err);
    return false;
  }
}

// Show save dialog, set currentFileHandle, then save
async function saveWithDialog() {
  if (!cards.length) return false;
  const today = new Date().toISOString().split('T')[0];
  const lastFilename = deckName() || `lernkarten-${today}.csv`;

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: lastFilename,
        types: [{ description: 'CSV Files', accept: { 'text/csv': ['.csv'] } }]
      });
      localStorage.setItem('lastFilePath', handle.name);
      const writable = await handle.createWritable();
      await writable.write('﻿' + generateCSV(true));
      await writable.close();
      currentFileHandle = handle;
      markSaved();
      return true;
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error('Save error:', err);
        alert('Speichern fehlgeschlagen: ' + err.message);
      }
      return false;
    }
  }

  // Fallback: trigger download
  localStorage.setItem('lastFilePath', lastFilename);
  const blob = new Blob(['﻿' + generateCSV(true)], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = lastFilename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  markSaved();
  return true;
}

// ── CSV Import ────────────────────────────────────────────────
// „Karten ergänzen“: Karten aus einer Datei zur geladenen Kartei hinzufügen.
// Vorhandene Karten und ihre Level bleiben unverändert, doppelte Fragen werden übersprungen.
function triggerMerge() {
  document.getElementById('csv-add').click();
}

async function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    input.value = '';
    const text = e.target.result.replace(/^﻿/, '');
    const fileCards = extractCards(parseCSV(text));
    if (!fileCards.length) { alert('In dieser Datei wurden keine Karten gefunden.'); return; }

    // Duplikat-Check gegen vorhandene Karten und innerhalb der Datei
    const existing = new Set(cards.map(c => normQ(c.question)));
    const toAdd = [];
    let skipped = 0;
    for (const c of fileCards) {
      const key = normQ(c.q);
      if (existing.has(key)) { skipped++; continue; }
      existing.add(key);
      toAdd.push(c);
    }

    let added = 0;
    try {
      await Promise.all(toAdd.map(c => addDoc(collection(db, 'cards'), {
        userId: currentUser.uid,
        question: c.q,
        answer: c.a,
        level: c.level,
        createdAt: new Date()
      })));
      added = toAdd.length;
    } catch (err) {
      console.error('Import error:', err);
      alert('Fehler beim Ergänzen: ' + err.message);
    }

    let saved = false;
    if (added > 0 && currentFileHandle) saved = await saveToCurrentHandle();

    let msg = `${added} neue Karte${added !== 1 ? 'n' : ''} ergänzt.`;
    if (skipped > 0) msg += `\n${skipped} Karte${skipped !== 1 ? 'n waren' : ' war'} schon vorhanden und ${skipped !== 1 ? 'wurden' : 'wurde'} übersprungen.`;
    if (added > 0) {
      msg += saved
        ? `\n\nDie Kartei wurde in »${deckName()}« gesichert.`
        : '\n\nTipp: Mit »Speichern« sicherst du die erweiterte Kartei in einer Datei.';
    }
    alert(msg);
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cell += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(c => c.trim())) rows.push(row);
        row = [];
      } else { cell += ch; }
    }
  }
  if (cell || row.length) { row.push(cell); if (row.some(c => c.trim())) rows.push(row); }
  return rows;
}

// ── Quiz engine ───────────────────────────────────────────────
function pickCards(cardsArray, n) {
  const pool = cardsArray.map(c => ({ c, w: WEIGHTS[c.level || 0] }));
  const out = [];
  for (let i = 0; i < Math.min(n, pool.length); i++) {
    const total = pool.reduce((s, p) => s + p.w, 0);
    let r = Math.random() * total;
    let j = 0;
    while (j < pool.length - 1 && r > pool[j].w) { r -= pool[j].w; j++; }
    out.push(pool[j].c);
    pool.splice(j, 1);
  }
  return out;
}

function startQuiz() {
  if (!cards.length) { alert('Noch keine Karten vorhanden.'); return; }
  const picked = pickCards(cards, 10);
  Q = {
    queue: [...picked],
    drill: [],
    drilling: false,
    mainTotal: picked.length,
    mainDone: 0,
    improved: 0,
  };
  showScreen('s-quiz');
  document.getElementById('quiz-title').textContent = 'Abfrage';
  advance();
}

function endQuiz() {
  removeKeyListener();
  if (confirm('Abfrage beenden?')) showScreen('s-home');
}

function advance() {
  if (!Q.queue.length) {
    if (!Q.drill.length) { removeKeyListener(); summary(); return; }
    Q.drilling = true;
    Q.queue = [...Q.drill];
    Q.drill = [];
    document.getElementById('quiz-title').textContent = 'Nachpauken';
  }
  Q.current = Q.queue.shift();
  renderCard();
  addKeyListener();
}

function renderCard() {
  const c = Q.current;

  let progHtml;
  if (!Q.drilling) {
    const pct = Math.round((Q.mainDone / Q.mainTotal) * 100);
    progHtml = `<div class="quiz-meta">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="prog-txt">${Q.mainDone} / ${Q.mainTotal}</span>
    </div>`;
  } else {
    const left = Q.queue.length + 1 + Q.drill.length;
    progHtml = `<div class="quiz-meta">
      <div class="prog-bar"><div class="prog-fill" style="width:100%;background:#EF4444"></div></div>
      <span class="prog-txt" style="color:#EF4444">noch ${left} zu pauken</span>
    </div>`;
  }

  document.getElementById('quiz-body').innerHTML = `
    ${progHtml}
    <div class="quiz-actions">
      <button onclick="editFromQuiz()">✏️ Editieren</button>
      <button onclick="endQuiz()">✕ Beenden</button>
    </div>
    <div class="flashcard" id="fc" onclick="reveal()">
      ${Q.drilling ? '<span class="drill-badge">Wiederholen</span>' : ''}
      <div class="fc-label">Frage</div>
      <div class="fc-text">${esc(c.question)}</div>
      <div id="ans-block" style="display:none">
        <div class="fc-divider"></div>
        <div class="fc-label">Antwort</div>
        <div class="fc-text">${esc(c.answer)}</div>
      </div>
      <div class="fc-tap-hint" id="hint">Tippen oder beliebige Taste drücken</div>
    </div>
    <div class="rating-wrap" id="rating-wrap">
      <div class="rating-lbl">Gewusst?</div>
      <div class="rating-btns-2">
        <button class="rbtn2 r-yes" onclick="rate(true)">Gewusst ✓<span class="kbd">C</span></button>
        <button class="rbtn2 r-no"  onclick="rate(false)">Nicht gewusst<span class="kbd">M</span></button>
      </div>
    </div>`;
}

function editFromQuiz() {
  removeKeyListener();
  removeRatingKeyListener();
  const c = Q.current;
  const fc = document.getElementById('fc');
  fc.onclick = null;
  fc.style.cursor = 'default';
  fc.innerHTML = `
    <div class="fc-label">Frage</div>
    <textarea id="qe-q" class="card-edit-field" style="min-height:80px">${escTxt(c.question)}</textarea>
    <div class="fc-divider"></div>
    <div class="fc-label">Antwort</div>
    <textarea id="qe-a" class="card-edit-field" style="min-height:100px">${escTxt(c.answer)}</textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="save-btn" onclick="saveFromQuiz('${c.id}')">✓ Speichern</button>
      <button class="cancel-btn" onclick="cancelQuizEdit()">✕ Abbrechen</button>
    </div>`;
  document.getElementById('rating-wrap').style.display = 'none';
  document.getElementById('qe-q').focus();
}

async function saveFromQuiz(id) {
  const q = document.getElementById('qe-q').value.trim();
  const a = document.getElementById('qe-a').value.trim();
  if (!q || !a) { alert('Frage und Antwort dürfen nicht leer sein.'); return; }
  try {
    await updateDoc(doc(db, 'cards', id), { question: q, answer: a });
    Q.current.question = q;
    Q.current.answer = a;
    autoSave();
  } catch (err) {
    alert('Fehler: ' + err.message);
  }
  renderCard();
  reveal();
}

function cancelQuizEdit() {
  renderCard();
  reveal();
}

function onKey(e) {
  if (['Shift','Control','Alt','Meta','Tab','CapsLock','Escape'].includes(e.key)) return;
  reveal();
}

function onRatingKey(e) {
  if (e.key === 'c' || e.key === 'C') rate(true);
  else if (e.key === 'm' || e.key === 'M') rate(false);
}

function addKeyListener()    { document.addEventListener('keydown', onKey); }
function removeKeyListener() { document.removeEventListener('keydown', onKey); }
function addRatingKeyListener()    { document.addEventListener('keydown', onRatingKey); }
function removeRatingKeyListener() { document.removeEventListener('keydown', onRatingKey); }

function reveal() {
  removeKeyListener();
  document.getElementById('ans-block').style.display = 'block';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('rating-wrap').style.display = 'block';
  const fc = document.getElementById('fc');
  fc.style.cursor = 'default';
  fc.onclick = null;
  addRatingKeyListener();
}

async function rate(knew) {
  removeRatingKeyListener();
  const c = Q.current;
  const newLevel = knew
    ? Math.min(4, (c.level || 0) + 1)
    : Math.max(0, (c.level || 0) - 1);

  // Update local array immediately so CSV has current levels
  const localCard = cards.find(card => card.id === c.id);
  if (localCard) localCard.level = newLevel;
  c.level = newLevel;

  try {
    await updateDoc(doc(db, 'cards', c.id), { level: newLevel });
  } catch (err) {
    console.error('Update error:', err);
  }

  if (currentFileHandle) saveToCurrentHandle();

  if (Q.drilling) {
    if (knew) { Q.improved++; }
    else { Q.drill.push(c); }
  } else {
    Q.mainDone++;
    if (!knew) { Q.drill.push(c); }
  }

  advance();
}

function summary() {
  if (currentFileHandle) saveToCurrentHandle();

  const good = cards.filter(c => c.level >= 3).length;
  const emoji = Q.improved > 0 ? '🚀' : '✅';
  const title = Q.improved > 0 ? 'Super gemacht!' : 'Runde beendet!';
  let msg = Q.improved > 0
    ? `${Q.improved} Karte${Q.improved !== 1 ? 'n' : ''} verbessert. `
    : 'Alle Karten durchgegangen. ';
  msg += `${good} von ${cards.length} Karten gut bekannt.`;

  document.getElementById('quiz-body').innerHTML = `
    <div class="summary">
      <div class="sum-emoji">${emoji}</div>
      <div class="sum-title">${title}</div>
      <div class="sum-text">${msg}</div>
      <div class="sum-btns">
        <button class="btn btn-primary" onclick="startQuiz()">Nochmal abfragen</button>
        <button class="btn btn-secondary" onclick="showScreen('s-home')">Zur Übersicht</button>
      </div>
    </div>`;
}

window.addEventListener('beforeunload', (e) => {
  if (!currentUser || !cards.length) return;
  if (currentFileHandle) {
    saveToCurrentHandle(); // fire and forget — local writes are usually fast enough
  } else {
    e.preventDefault();
    e.returnValue = '';
  }
});

// Expose functions globally
window.showScreen = showScreen;
window.startQuiz = startQuiz;
window.endQuiz = endQuiz;
window.advance = advance;
window.renderCard = renderCard;
window.reveal = reveal;
window.rate = rate;
window.editFromQuiz = editFromQuiz;
window.saveFromQuiz = saveFromQuiz;
window.cancelQuizEdit = cancelQuizEdit;
window.escTxt = escTxt;
window.addCard = addCard;
window.openCardsList = openCardsList;
window.editCard = editCard;
window.saveCard = saveCard;
window.cancelEdit = cancelEdit;
window.deleteCard = deleteCard;
window.saveToCurrentHandle = saveToCurrentHandle;
window.saveWithDialog = saveWithDialog;
window.importCSV = importCSV;
window.triggerMerge = triggerMerge;
window.saveNow = saveNow;
window.triggerImport = triggerImport;
window.processImportCSV = processImportCSV;
window.switchKartei = switchKartei;
window.newKartei = newKartei;
window.loginGoogle = loginGoogle;
window.logout = logout;
window.esc = esc;
window.parseCSV = parseCSV;
</script>
